---
# ---- Package repositories, updates, packages ----
- name: Update apt cache
  ansible.builtin.apt:
    lock_timeout: 300
    update_cache: true
    cache_valid_time: 3600

- name: Apply all available updates (incl. security)
  ansible.builtin.apt:
    lock_timeout: 300
    upgrade: safe

- name: Install required system packages
  ansible.builtin.apt:
    lock_timeout: 300
    name: "{{ common_packages }}"
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot if required (opt-in)
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: common_reboot_if_required | bool and reboot_required.stat.exists

# ---- Basic OS configuration ----
- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

# ---- Hardening: SSH ----
- name: Harden sshd (drop-in)
  ansible.builtin.copy:
    content: |
      # Managed by Ansible. "00-" prefix so it wins over cloud-init drop-ins (first match wins).
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      # NOTE: AllowTcpForwarding is left at its default (yes): the app host is the SSH jump host.
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
  register: sshd_dropin

- name: Validate sshd configuration before reloading
  ansible.builtin.command: sshd -t
  changed_when: false
  when: sshd_dropin.changed

- name: Reload sshd when its configuration changed
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
  when: sshd_dropin.changed

# ---- Hardening: kernel parameters ----
- name: Apply sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ common_sysctl | dict2items }}"

# ---- Hardening: fail2ban ----
- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 {{ vpc_cidr }}
      bantime  = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true
      backend = systemd
      port    = {{ common_ssh_port }}
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  register: f2b_conf

# ---- Hardening: firewall (SSH first, then default deny) ----
- name: UFW - allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ common_ssh_port | string }}"
    proto: tcp
    comment: SSH

- name: UFW - default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: UFW - default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: UFW - enable with logging
  community.general.ufw:
    state: enabled
    logging: "low"

# ---- Services: enabled at boot and running ----
- name: Enable and start baseline services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ common_services }}"

- name: Restart fail2ban when its configuration changed
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: f2b_conf.changed
