[defaults]
inventory            = inventory.ini
roles_path           = roles
remote_user          = ubuntu
interpreter_python   = auto_silent
host_key_checking    = True
forks                = 10
timeout              = 30
retry_files_enabled  = False

[ssh_connection]
pipelining = True
retries    = 3
# accept-new: trust a host key on first contact, refuse if it later changes (no manual prompt)
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new
