<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AWS architecture: multi-tier web application</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#232F3E"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6B7280"/></marker>
  </defs>
  <rect width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#232F3E">AWS Architecture: Multi-tier Web Application</text>

  <!-- AWS cloud + VPC -->
  <rect x="290" y="50" width="700" height="555" rx="14" fill="#ffffff" stroke="#232F3E" stroke-width="2"/>
  <text x="306" y="72" font-size="13" font-weight="bold" fill="#232F3E">AWS Cloud · eu-north-1</text>
  <rect x="310" y="85" width="660" height="500" rx="12" fill="#FAF7FF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="326" y="107" font-size="13" font-weight="bold" fill="#8C4FFF">VPC 10.0.0.0/16</text>

  <!-- Users, internet, admin -->
  <rect x="15" y="195" width="85" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="57" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">End users</text>
  <text x="57" y="240" text-anchor="middle" font-size="11" fill="#6B7280">Browser</text>
  <line x1="100" y1="225" x2="146" y2="225" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a1)"/>
  <ellipse cx="205" cy="225" rx="55" ry="32" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="205" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Internet</text>
  <line x1="262" y1="225" x2="328" y2="225" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="295" y="214" text-anchor="middle" font-size="10.5" fill="#232F3E">HTTP :80</text>
  <rect x="15" y="305" width="95" height="50" rx="8" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="62" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Admin</text>
  <text x="62" y="343" text-anchor="middle" font-size="11" fill="#6B7280">(your IP)</text>
  <line x1="95" y1="305" x2="175" y2="252" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="150" y="292" font-size="10.5" fill="#6B7280">SSH :22</text>

  <!-- Internet gateway -->
  <rect x="330" y="195" width="90" height="60" rx="8" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="375" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Internet</text>
  <text x="375" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Gateway</text>

  <!-- Public subnets -->
  <rect x="440" y="125" width="515" height="230" rx="10" fill="#F2FAF0" stroke="#3F8624" stroke-width="1.5"/>
  <text x="456" y="147" font-size="13" font-weight="bold" fill="#3F8624">Public subnets</text>
  <text x="456" y="164" font-size="11" fill="#6B7280">10.0.1.0/24 (AZ a) · 10.0.3.0/24 (AZ b, for the ALB)</text>
  <rect x="470" y="190" width="130" height="70" rx="8" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="535" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Application</text>
  <text x="535" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Load Balancer</text>
  <text x="535" y="246" text-anchor="middle" font-size="10.5" fill="#6B7280">listener :80 · public-sg</text>
  <line x1="422" y1="225" x2="468" y2="225" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="600" y1="225" x2="718" y2="225" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="659" y="214" text-anchor="middle" font-size="10.5" fill="#232F3E">HTTP :80</text>
  <rect x="720" y="190" width="210" height="70" rx="8" fill="#FFF3E6" stroke="#ED7100" stroke-width="1.5"/>
  <text x="825" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">App Server (EC2)</text>
  <text x="825" y="230" text-anchor="middle" font-size="11" fill="#232F3E">Nginx reverse proxy + app</text>
  <text x="825" y="247" text-anchor="middle" font-size="10.5" fill="#6B7280">app-tier-sg</text>
  <rect x="470" y="285" width="130" height="52" rx="8" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="535" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">NAT Gateway</text>
  <text x="535" y="324" text-anchor="middle" font-size="11" fill="#6B7280">+ Elastic IP</text>
  <text x="940" y="344" text-anchor="end" font-size="10.5" font-style="italic" fill="#6B7280">Route table: 0.0.0.0/0 → Internet Gateway</text>

  <!-- NAT paths (dashed) -->
  <line x1="470" y1="311" x2="388" y2="259" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <line x1="520" y1="395" x2="520" y2="341" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="530" y="375" font-size="10.5" fill="#6B7280">outbound updates</text>

  <!-- Private subnet -->
  <rect x="440" y="395" width="515" height="165" rx="10" fill="#EEF5FD" stroke="#147EBA" stroke-width="1.5"/>
  <text x="456" y="417" font-size="13" font-weight="bold" fill="#147EBA">Private subnet</text>
  <text x="456" y="434" font-size="11" fill="#6B7280">10.0.2.0/24 (AZ a)</text>
  <rect x="460" y="450" width="145" height="75" rx="8" fill="#E8F1FB" stroke="#2E73B8" stroke-width="1.5"/>
  <text x="532" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">MariaDB (EC2)</text>
  <text x="532" y="490" text-anchor="middle" font-size="11" fill="#232F3E">TCP 3306</text>
  <text x="532" y="507" text-anchor="middle" font-size="10.5" fill="#6B7280">db-tier-sg</text>
  <rect x="625" y="450" width="145" height="75" rx="8" fill="#FFF4E0" stroke="#FF9900" stroke-width="1.5"/>
  <text x="697" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">RabbitMQ (EC2)</text>
  <text x="697" y="490" text-anchor="middle" font-size="11" fill="#232F3E">TCP 5672</text>
  <text x="697" y="507" text-anchor="middle" font-size="10.5" fill="#6B7280">rabbitmq-tier-sg</text>
  <rect x="790" y="450" width="145" height="75" rx="8" fill="#EAF6E4" stroke="#3F8624" stroke-width="1.5"/>
  <text x="862" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Memcached (EC2)</text>
  <text x="862" y="490" text-anchor="middle" font-size="11" fill="#232F3E">TCP 11211</text>
  <text x="862" y="507" text-anchor="middle" font-size="10.5" fill="#6B7280">memcached-tier-sg</text>
  <text x="940" y="550" text-anchor="end" font-size="10.5" font-style="italic" fill="#6B7280">Route table: 0.0.0.0/0 → NAT Gateway</text>

  <!-- App to private tier -->
  <line x1="825" y1="262" x2="535" y2="447" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="825" y1="262" x2="697" y2="447" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="825" y1="262" x2="862" y2="447" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- Legend -->
  <line x1="320" y1="627" x2="360" y2="627" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="368" y="631" font-size="11" fill="#232F3E">Application traffic</text>
  <line x1="520" y1="627" x2="560" y2="627" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="568" y="631" font-size="11" fill="#232F3E">Admin and outbound traffic</text>
</svg>
