<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 255" width="1000" height="255" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Delivery workflow: Terraform then Ansible</title>
  <defs>
    <marker id="w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6B7280"/></marker>
  </defs>
  <rect width="1000" height="255" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#232F3E">Delivery Workflow</text>

  <!-- 1 -->
  <rect x="14" y="50" width="172" height="150" rx="10" fill="#F5F7FF" stroke="#3B48CC" stroke-width="1.5"/>
  <circle cx="38" cy="78" r="14" fill="#3B48CC"/><text x="38" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="83" font-size="13" font-weight="bold" fill="#232F3E">Write code</text>
  <text x="28" y="115" font-size="11" fill="#232F3E">• Terraform (.tf)</text>
  <text x="28" y="137" font-size="11" fill="#232F3E">• Ansible playbooks (.yml)</text>
  <text x="28" y="159" font-size="11" fill="#232F3E">• Edit in VS Code</text>
  <rect x="45" y="212" width="110" height="24" rx="12" fill="#E3F4E1"/><text x="100" y="228" text-anchor="middle" font-size="11" fill="#2D6A1F">Ready</text>
  <line x1="188" y1="125" x2="212" y2="125" stroke="#6B7280" stroke-width="1.8" marker-end="url(#w1)"/>

  <!-- 2 -->
  <rect x="214" y="50" width="172" height="150" rx="10" fill="#F4F6F8" stroke="#232F3E" stroke-width="1.5"/>
  <circle cx="238" cy="78" r="14" fill="#232F3E"/><text x="238" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="260" y="83" font-size="13" font-weight="bold" fill="#232F3E">Push to GitHub</text>
  <text x="228" y="115" font-size="11" fill="#232F3E">• Store Terraform code</text>
  <text x="228" y="137" font-size="11" fill="#232F3E">• Store Ansible playbooks</text>
  <text x="228" y="159" font-size="11" fill="#232F3E">• Track every change</text>
  <rect x="245" y="212" width="110" height="24" rx="12" fill="#E3F4E1"/><text x="300" y="228" text-anchor="middle" font-size="11" fill="#2D6A1F">Ready</text>
  <line x1="388" y1="125" x2="412" y2="125" stroke="#6B7280" stroke-width="1.8" marker-end="url(#w1)"/>

  <!-- 3 -->
  <rect x="414" y="50" width="172" height="150" rx="10" fill="#FAF7FF" stroke="#8C4FFF" stroke-width="1.5"/>
  <circle cx="438" cy="78" r="14" fill="#8C4FFF"/><text x="438" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="460" y="83" font-size="13" font-weight="bold" fill="#232F3E">Terraform</text>
  <text x="428" y="115" font-size="11" fill="#232F3E">• VPC, subnets, IGW, NAT</text>
  <text x="428" y="137" font-size="11" fill="#232F3E">• Routes, security groups</text>
  <text x="428" y="159" font-size="11" fill="#232F3E">• ALB and 4 EC2 instances</text>
  <rect x="445" y="212" width="110" height="24" rx="12" fill="#E3F4E1"/><text x="500" y="228" text-anchor="middle" font-size="11" fill="#2D6A1F">Implemented</text>
  <line x1="588" y1="125" x2="612" y2="125" stroke="#6B7280" stroke-width="1.8" marker-end="url(#w1)"/>

  <!-- 4 -->
  <rect x="614" y="50" width="172" height="150" rx="10" fill="#FFF5F5" stroke="#EE0000" stroke-width="1.5"/>
  <circle cx="638" cy="78" r="14" fill="#EE0000"/><text x="638" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="660" y="83" font-size="13" font-weight="bold" fill="#232F3E">Ansible</text>
  <text x="628" y="115" font-size="11" fill="#232F3E">• Connects to the EC2 hosts</text>
  <text x="628" y="137" font-size="11" fill="#232F3E">• Installs packages, Nginx</text>
  <text x="628" y="159" font-size="11" fill="#232F3E">• Configures all services</text>
  <rect x="645" y="212" width="110" height="24" rx="12" fill="#FFF1D6"/><text x="700" y="228" text-anchor="middle" font-size="11" fill="#8A5A00">In progress</text>
  <line x1="788" y1="125" x2="812" y2="125" stroke="#6B7280" stroke-width="1.8" marker-end="url(#w1)"/>

  <!-- 5 -->
  <rect x="814" y="50" width="172" height="150" rx="10" fill="#F2FAF0" stroke="#3F8624" stroke-width="1.5"/>
  <circle cx="838" cy="78" r="14" fill="#3F8624"/><text x="838" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="860" y="83" font-size="13" font-weight="bold" fill="#232F3E">Access the app</text>
  <text x="828" y="115" font-size="11" fill="#232F3E">• Open the ALB DNS name</text>
  <text x="828" y="137" font-size="11" fill="#232F3E">• ALB forwards to Nginx</text>
  <text x="828" y="159" font-size="11" fill="#232F3E">• App uses DB, MQ, cache</text>
  <rect x="845" y="212" width="110" height="24" rx="12" fill="#EEEEEE"/><text x="900" y="228" text-anchor="middle" font-size="11" fill="#555555">Needs step 4</text>
</svg>
